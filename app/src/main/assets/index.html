<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14202b">
<title>Дневник тренировок</title>
<style>
:root{--bg:#f0f3f8;--bg2:#e7ecf4;--card:#fff;--ink:#0e1a2b;--mut:#6a778a;--line:#d9e0ea;--acc:#2f5bff;--acs:#e9eeff;--accink:#fff;--ok:#16a36a;--oks:#e3f6ec;--oks2:#d2efe1;--okd:#0d7a4d;--lo:#1f8fd1;--mid:#d98200;--bad:#d9453f;--sh:0 1px 2px rgba(14,26,43,.06),0 8px 20px rgba(14,26,43,.06);--fd:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c121a;--bg2:#121b26;--card:#16202c;--ink:#e9eff6;--mut:#8a97a8;--line:#27323f;--acc:#7b95ff;--acs:#1c2745;--accink:#0b1220;--ok:#37c88a;--oks:#12301f;--oks2:#173a29;--okd:#7ae0b2;--lo:#52b4f0;--mid:#f0a93a;--bad:#f27a74;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#0c121a;--bg2:#121b26;--card:#16202c;--ink:#e9eff6;--mut:#8a97a8;--line:#27323f;--acc:#7b95ff;--acs:#1c2745;--accink:#0b1220;--ok:#37c88a;--oks:#12301f;--oks2:#173a29;--okd:#7ae0b2;--lo:#52b4f0;--mid:#f0a93a;--bad:#f27a74;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:560px;margin:0 auto;padding:14px 14px 150px}
h1{font:700 32px/1 var(--fd);margin:8px 0 4px;letter-spacing:.6px;text-transform:uppercase}
h1::after{content:"";display:block;width:44px;height:4px;border-radius:2px;background:var(--acc);margin-top:8px}
button{font:inherit;color:inherit;cursor:pointer}
button:active{transform:scale(.96)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hint{color:var(--mut);font-size:14px;margin:6px 0 8px}
.tabs{display:flex;gap:4px;margin:10px 0 16px;padding:4px;background:var(--bg2);border-radius:14px}
.tab{flex:1;padding:10px 2px;border:0;background:transparent;border-radius:11px;font-weight:600;font-size:14px;color:var(--mut)}
.tab.on{background:var(--acc);color:var(--accink);box-shadow:0 4px 12px rgba(47,91,255,.35)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{padding:8px 16px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;font-weight:600}
.chip.on{background:var(--acc);color:var(--accink);border-color:var(--acc);box-shadow:0 4px 12px rgba(47,91,255,.3)}
input,textarea{font:inherit;color:inherit;background:var(--bg2);border:1.5px solid transparent;border-radius:10px;padding:11px;width:100%;min-width:0}
input:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acs)}
input::placeholder,textarea::placeholder{color:var(--mut);opacity:.7}
textarea{background:var(--card);border-color:var(--line);min-height:200px;margin-bottom:6px}
.dt{width:auto;margin-bottom:12px;font-weight:700;background:var(--card);border:1.5px solid var(--line);padding:9px 12px;border-radius:12px}
.ex{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:var(--sh)}
.row{display:flex;gap:8px;align-items:center}
.ex .nm{font:700 23px var(--fd);background:transparent;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:6px 2px;box-shadow:none}
.ex .nm:focus{border-bottom-color:var(--acc);box-shadow:none}
.x{border:0;background:none;color:var(--mut);font-size:26px;padding:4px 10px;width:auto}
.ex .hint{background:var(--acs);border-radius:10px;padding:8px 10px;color:var(--ink);margin:10px 0 8px}
.set{padding:10px 0;border-top:1px dashed var(--line)}
.nums{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:center;text-align:center;color:var(--mut)}
.nums input{text-align:center;font:700 25px var(--fd);padding:9px 4px}
.opts{display:flex;gap:6px;margin-top:8px}
.opt{flex:1;padding:9px 6px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;font-size:14px;font-weight:600;color:var(--mut)}
.opt.s{font-weight:700}
.opt.l{color:var(--lo);border-color:var(--lo)}.opt.m{color:var(--mid);border-color:var(--mid)}.opt.h{color:var(--bad);border-color:var(--bad)}
.opts .x{flex:0 0 auto;font-size:22px}
.add{width:100%;padding:12px;border:1.5px dashed var(--acc);background:transparent;border-radius:12px;color:var(--acc);font-weight:700;margin-top:8px}
.pri{width:100%;padding:15px;border:0;border-radius:14px;background:var(--acc);color:var(--accink);font-weight:700;font-size:17px;margin-top:12px;box-shadow:0 8px 20px rgba(47,91,255,.35)}
.sec{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);font-weight:600;margin-top:8px}
.note{margin-top:10px}
.w{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:var(--sh)}
.w b{font:700 21px var(--fd)}
.w pre{white-space:pre-wrap;font:inherit;font-size:15px;margin:8px 0;color:var(--ink)}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:none;gap:6px;overflow-x:auto;white-space:nowrap;z-index:20;box-shadow:0 -6px 18px rgba(14,26,43,.08)}
#bar.on{display:flex}

.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:30;font-weight:600;box-shadow:var(--sh)}
.pl{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh)}
.pl b{font:700 23px var(--fd)}.pl span{color:var(--mut);font-size:14px}
.pl.dn{border-left-color:var(--ok);background:var(--oks)}
.pg{display:block;width:100%;height:6px;border-radius:3px;background:var(--bg2);margin-top:8px;overflow:hidden;font-style:normal}
.pg u{display:block;height:100%;background:var(--ok);text-decoration:none;border-radius:3px}
.back{border:0;background:none;color:var(--acc);font-weight:700;padding:4px 0 10px;font-size:16px}
.pname{margin-bottom:12px;font-size:28px;font-family:var(--fd);font-weight:700;background:transparent;border:0;border-bottom:2px solid var(--line);border-radius:0}
.pr{display:flex;gap:8px;margin-bottom:8px;align-items:stretch}
.prc{display:grid;grid-template-columns:15fr 17fr 15fr 5fr 15fr 26fr 7fr;flex:1;min-width:0;background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh)}
.prc>*{min-width:0;border-right:1px solid var(--line)}.prc>:last-child{border-right:0}
.prc input{border:0;background:transparent;border-radius:0;text-align:center;font:700 22px var(--fd);padding:0 2px;height:58px}
.prc>input:first-child{font-size:17px;color:var(--mut)}
.prc input:focus{background:var(--acs);box-shadow:inset 0 0 0 2px var(--acc)}
.prc .xx{display:grid;place-items:center;color:var(--mut);font-size:14px;border-right:0;height:58px}
.prc .pe{border:0;background:transparent;font-size:12px;line-height:1.15;padding:2px;font-weight:700;height:58px;word-break:break-word}
.pe.l{color:var(--lo)}.pe.m{color:var(--mid)}.pe.h{color:var(--bad)}.pe.e{color:var(--mut);font-size:20px;font-weight:400}
.prc .pd{border:0;background:none;color:var(--mut);font-size:20px;height:58px;padding:0}
.prc.ok{background:repeating-linear-gradient(135deg,var(--oks) 0 9px,var(--oks2) 9px 18px);border-color:var(--ok)}
.prc.ok>*{border-right-color:rgba(22,163,106,.35)}
.prc.ok input,.prc.ok .pe{color:var(--okd)}
.ck{flex:0 0 50px;border-radius:14px;border:2px dashed var(--line);background:var(--card);color:var(--line);display:grid;place-items:center;padding:0}
.ck.on{background:var(--ok);border:2px solid var(--ok);color:#fff;box-shadow:0 6px 16px rgba(22,163,106,.4)}
.pr.ph{margin-bottom:4px}
.prc.hd{background:transparent;border:0;box-shadow:none;overflow:visible}
.prc.hd>*{border:0;text-align:center;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mut)}
.ck.sp{visibility:hidden;border:0}
.plh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 8px;padding:10px 12px;border:1.5px dashed var(--acc);border-radius:12px;background:var(--card)}
.plh small{display:block;color:var(--mut);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.plh b{font:700 24px var(--fd)}.plh em{font-style:normal;margin-left:8px;color:var(--mid);font-weight:700;font-size:14px}
.plb{flex:0 0 auto;border:0;background:var(--acc);color:var(--accink);padding:10px 14px;border-radius:10px;font-weight:700}
.plh.dn{border-color:var(--ok);background:var(--oks);color:var(--okd);font-weight:700;justify-content:flex-start}
mark{background:var(--acs);color:var(--acc);border-radius:4px;padding:0 2px;font-weight:700}
.hs{margin-bottom:12px;background:var(--card);border:1.5px solid var(--line)}
.toast{max-width:90vw;text-align:center;animation:tin .25s ease}
@keyframes vin{from{opacity:0;transform:translateX(var(--dx,18px))}to{opacity:1;transform:none}}
@keyframes cin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.3)}100%{transform:scale(1);opacity:1}}
@keyframes flash{from{box-shadow:0 0 0 0 rgba(22,163,106,.55)}to{box-shadow:0 0 0 16px rgba(22,163,106,0)}}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.view.anim{animation:vin .3s cubic-bezier(.2,.8,.2,1)}
.pr.pop .ck svg{animation:pop .38s cubic-bezier(.3,1.6,.5,1)}
.pr.pop .prc{animation:flash .6s ease-out}
button{transition:transform .15s ease,box-shadow .2s ease,background-color .2s ease,border-color .2s ease,color .2s ease,filter .2s ease}
.pri:active{transform:translateY(1px) scale(.98);filter:brightness(.95);box-shadow:0 3px 8px rgba(47,91,255,.3)}
.ck:active{transform:scale(.9)}
@media (hover:hover){
.tab:not(.on):hover{background:var(--card);color:var(--ink)}
.chip:hover{border-color:var(--acc);transform:translateY(-1px)}
.chip.on:hover,.plb:hover,.back:hover{filter:brightness(1.1)}
.pri:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 12px 26px rgba(47,91,255,.45)}
.sec:hover,.opt:hover{border-color:var(--acc);transform:translateY(-1px)}
.pl:hover,.w:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(14,26,43,.08),0 12px 26px rgba(14,26,43,.1)}
.add:hover{background:var(--acs)}
.ck:hover{border-color:var(--ok);color:var(--ok)}
.ck.on:hover{color:#fff;filter:brightness(1.08)}
.x:hover,.pd:hover{color:var(--bad)}
.pe:hover,.ch:hover{background:var(--acs)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pl,.w{transition:transform .2s ease,box-shadow .2s ease}
.calc{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--mid);border-radius:16px;margin-bottom:12px;box-shadow:var(--sh);overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 16px;border:0;background:none;font:700 21px var(--fd);text-align:left}
.ch i{font-style:normal;color:var(--acc);font-size:26px;line-height:1}
.calcb{padding:0 16px 14px;animation:cin .28s ease}
.cr{text-align:center;margin:12px 0 8px}.cr small{display:block;color:var(--mut);font-size:13px;font-weight:600}.cr b{font:700 42px var(--fd);color:var(--acc)}
.ct{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:8px}
.cl{display:grid;grid-template-columns:1fr 1fr 60px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);text-align:center}
.cl:last-child{border-bottom:0}
.cl span{text-align:left;font-weight:600;color:var(--mut)}.cl b{font:700 23px var(--fd)}.cl i{font-style:normal;color:var(--mut);font-size:14px;text-align:right}
.cl.me{background:var(--acs)}.cl.me span{color:var(--acc)}
</style>
</head>
<body>
<main id="app"></main>
<div id="bar" aria-label="Подсказки"></div>
<script>
const K='gymlog1';
const VER='1.6';
let db={workouts:[],cur:null,sug:{},names:[],types:['Push','Pull']};
try{const s=localStorage.getItem(K);if(s)db=Object.assign(db,JSON.parse(s))}catch(e){}
let cloud=null,pt=null,syncTxt='Данные только на этом устройстве';
function setSync(t){syncTxt=t;const e=document.getElementById('sync');if(e)e.textContent=t}
const save=remote=>{if(remote!==true)db.ts=Date.now();try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}if(remote!==true)pushMeta()};
function pushMeta(){
  if(!cloud)return;clearTimeout(pt);
  pt=setTimeout(()=>{cloud.doc('meta').set({ts:db.ts||Date.now(),sug:db.sug,names:db.names,types:db.types,cur:db.cur,plans:db.plans||[]}).catch(()=>setSync('Не удалось синхронизировать'))},1000);
}
function pushW(w){if(cloud)cloud.doc('w_'+w.id).set({w}).catch(()=>{})}
function delW(id){if(cloud)cloud.doc('w_'+id).delete().catch(()=>{})}
function applyRemote(snap){
  let ch=false;
  snap.docChanges().forEach(c=>{
    const id=c.doc.id,d=c.doc.data();
    if(id==='meta'){
      if(c.type==='removed'||!d||!(d.ts>(db.ts||0)))return;
      const a=document.activeElement;if(a&&a.dataset&&(a.dataset.k||a.dataset.pk))return;
      db.sug=d.sug||{};db.names=d.names||[];db.types=d.types||db.types;if(d.cur)db.cur=d.cur;if(d.plans)db.plans=d.plans;db.ts=d.ts;ch=true;
    }else if(id.indexOf('w_')===0){
      const wid=id.slice(2);
      if(c.type==='removed'){const n=db.workouts.length;db.workouts=db.workouts.filter(w=>String(w.id)!==wid);if(db.workouts.length!==n)ch=true}
      else if(d&&d.w&&!db.workouts.some(w=>w.id===d.w.id)){db.workouts.push(d.w);ch=true}
    }
  });
  if(ch){sortW();save(true);render()}
}
async function initCloud(){
  try{
    if(!window.claude)return;
    const [user,dbm]=await Promise.all([claude.use('user'),claude.use('db')]);
    if(!user||!dbm)return;
    const uid=await user.id();if(!uid)return;
    cloud=dbm.collection('data/users/'+uid);
    let first=true;setSync('Синхронизация…');
    cloud.onSnapshot(snap=>{
      applyRemote(snap);
      if(first){
        first=false;
        const ids=new Set(snap.docs.map(d=>d.id));
        db.workouts.forEach(w=>{if(!ids.has('w_'+w.id))pushW(w)});
        const m=snap.docs.find(d=>d.id==='meta'),rts=m&&m.data()?m.data().ts:0;
        if(!rts||(db.ts||0)>rts){db.ts=db.ts||Date.now();pushMeta()}
      }
      setSync('Синхронизировано с аккаунтом');
    },()=>setSync('Нет связи, записи сохранены на устройстве'));
  }catch(e){}
}
const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const newSet=()=>({w:'',r:'',n:'',side:'',eff:''});
const newEx=()=>({name:'',sets:[newSet()],note:''});
const newCur=()=>({id:Date.now(),date:today(),type:db.types[0]||'',exs:[newEx()]});
if(!db.cur)db.cur=newCur();
if(!db.plans)db.plans=[];
let tab='today',open=null,planOpen=null,histQ='',popRow=null,lastKey=null,lastOrd=0,calc={w:'',r:'',i:''},calcOpen=false,impText='',imp=null,impMsg='',bar=document.getElementById('bar'),app=document.getElementById('app');
const SIDE={'':'Оба','П':'Правая','Л':'Левая'},SIDES=['','П','Л'];
const EFF=['','л','с','т'],EFFN={'':'Нагрузка','л':'Легко','с':'Средне','т':'Тяжело'};

function sortW(){db.workouts.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id)}
function learn(w){w.exs.forEach(e=>{const nm=e.name.trim();if(!nm)return;db.names=[nm].concat(db.names.filter(x=>x!==nm)).slice(0,80);e.sets.forEach(s=>{addSug(nm,'w',s.w);addSug(nm,'r',s.r);addSug(nm,'n',s.n)});addSug(nm,'note',e.note)})}
const dup=w=>db.workouts.some(x=>x.date===w.date&&x.type===w.type);
function parseNotes(text){
  const out=[];let w=null,ex=null,side='';
  const DAYS=/(понедельник|вторник|сред[ауы]|четверг|пятниц[ауы]|суббот[ауы]|воскресень[ея])/i;
  const TYPES=[['push','Push'],['pull','Pull'],['legs','Legs'],['ноги','Ноги'],['верх','Верх'],['низ','Низ'],['full','Full body']];
  const now=new Date(),p2=n=>String(n).padStart(2,'0'),cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
  const SET=/(\d+(?:\.\d+)?)x(\d+)(?:x(\d+))?/g;
  const effOf=t=>{const h=/тяж/i.test(t),l=/легк|л[её]гк/i.test(t),m=/средн/i.test(t);return (m||(h&&l))?'с':h?'т':l?'л':''};
  text.split(/\r?\n/).forEach(raw=>{
    let line=raw.replace(/[\u00a0\t]/g,' ').replace(/(\d)\s*кг\.?/gi,'$1').replace(/(\d),(\d)/g,'$1.$2').replace(/(\d)\s*[хХxX×*]\s*(?=\d)/g,'$1x');
    const bullet=/^\s*[•·▪●○◦\-–—*]\s*/.test(line);
    line=line.replace(/^[\s•·▪●○◦\-–—*]+/,'').trim();
    if(!line||/^\d{1,2}:\d{2}$/.test(line))return;
    const hm=line.match(/^(\d{1,2})[.\/](\d{1,2})(?:[.\/](\d{2,4}))?\.?\s*[,:\-–—]?\s*(.*)$/);
    if(hm&&!/\dx\d/.test(line)&&!/символов/i.test(line)){
      const rest=hm[4],rl=rest.toLowerCase();let type='';
      for(const t of TYPES){if(rl.indexOf(t[0])>=0){type=t[1];break}}
      const d=+hm[1],mo=+hm[2];
      if((type||DAYS.test(rest))&&mo>=1&&mo<=12&&d>=1&&d<=31){
        let y=hm[3]?(hm[3].length===2?2000+(+hm[3]):+hm[3]):now.getFullYear();
        if(!hm[3]&&new Date(y,mo-1,d)>new Date(now.getTime()+2*864e5))y--;
        w={id:0,date:y+'-'+p2(mo)+'-'+p2(d),type:type,exs:[]};out.push(w);ex=null;side='';return;
      }
    }
    if(!w)return;
    if(/^\/\/\s*/.test(line)){if(ex)ex.c.push(raw.replace(/^[\s\u00a0]*\/\/\s*/,'').trim());return}
    let ln=line;const sm=ln.toLowerCase().match(/^(правая|правый|правой|правую|прав|левая|левый|левой|левую|лев)(?=[\s:.\-–]|$)|^([пл])(?=\s*:)/);
    if(sm){const wd=sm[1]||sm[2];side=wd.charAt(0)==='п'?'П':'Л';ln=ln.slice(sm[0].length).replace(/^[\s:.\-–]+/,'')}
    if(!ln)return;
    const ms=[...ln.matchAll(SET)];
    if(/^\d/.test(ln)&&ms.length&&ms[0].index===0){
      if(!ex){ex={name:'Без названия',sets:[],note:'',c:[]};w.exs.push(ex)}
      ms.forEach((m,i)=>{

  else if(a==='delset'){const s=c.exs[i].sets;s.splice(j,1);if(!s.length)s.push(newSet())}
  else if(a==='side'){const s=c.exs[i].sets[j];s.side=SIDES[(SIDES.indexOf(s.side)+1)%3]}
  else if(a==='eff'){const s=c.exs[i].sets[j];s.eff=EFF[(EFF.indexOf(s.eff)+1)%4]}
  else if(a==='finish'){
    commit();c.exs=c.exs.filter(x=>x.name.trim());
    if(!c.exs.length){toast('Добавь хотя бы одно упражнение');return}
    const mk=[];
    if(!c.pm){c.exs.forEach(e=>{const p=planFor(e.name);if(!p||!e.sets.some(x=>x.w||x.r))return;const r=p.rows.find(x=>!x.d&&(x.w||x.r));if(r){r.d=true;mk.push(p.name)}});c.pm=1}
    db.workouts.push(c);sortW();pushW(c);db.cur=newCur();tab='hist';open=c.id;toast('Тренировка сохранена'+(mk.length?'. В плане отмечено: '+mk.join(', '):''));
  }
  else if(a==='copycur'){copy(wTxt(c,1));return}
  else if(a==='open'){open=open===+v?null:+v}
  else if(a==='copyw'){copy(wTxt(db.workouts.find(w=>w.id===+v),1));return}
  else if(a==='repeat'){const w=db.workouts.find(x=>x.id===+v);db.cur={id:Date.now(),date:today(),type:w.type,exs:w.exs.map(x=>({name:x.name,note:'',sets:x.sets.map(s=>Object.assign({},s))}))};tab='today';window.scrollTo(0,0)}
  else if(a==='calc'){calcOpen=!calcOpen}
  else if(a==='newplan'){const q={id:Date.now(),name:'',rows:[newRow(null)]};db.plans.push(q);planOpen=q.id}
  else if(a==='popen'){planOpen=+v}
  else if(a==='pback'){planOpen=null}
  else if(a==='delplan'){if(!confirm('Удалить это упражнение из планов?'))return;db.plans.splice(i,1);planOpen=null}
  else if(a==='addrow'){const rs=db.plans[i].rows;rs.push(newRow(rs[rs.length-1]))}
  else if(a==='delrow'){const rs=db.plans[i].rows;rs.splice(j,1);if(!rs.length)rs.push(newRow(null))}
  else if(a==='applyplan'){const e=c.exs[i],p=planFor(e.name),r=p&&p.rows.find(x=>!x.d&&(x.w||x.r));if(!r)return;if(e.sets.some(x=>x.w||x.r)&&!confirm('Заменить подходы значениями из плана?'))return;e.sets=[{w:r.w,r:r.r,n:r.n,side:'',eff:''}]}
  else if(a==='gow'){histQ='';open=+v;tab='hist';window.scrollTo(0,0)}
  else if(a==='pdone'){const r=db.plans[i].rows[j];r.d=!r.d;popRow=r.d?i+'-'+j:null;if(r.d&&navigator.vibrate)navigator.vibrate(15)}
  else if(a==='peff'){const r=db.plans[i].rows[j];r.e=PE[(PE.indexOf(r.e)+1)%PE.length]}
  else if(a==='parse'){const ta=document.getElementById('impt');if(ta)impText=ta.value;imp=parseNotes(impText);impMsg=imp.length?'':'Не нашёл ни одной тренировки. Каждая должна начинаться со строки вроде «14.11 Push».'}
  else if(a==='doimp'){let n=0,sk=0;imp.forEach((x,i)=>{if(dup(x)){sk++;return}x.id=Date.now()+i;if(x.type&&db.types.indexOf(x.type)<0)db.types.push(x.type);db.workouts.push(x);pushW(x);learn(x);n++});sortW();imp=null;impText='';impMsg='';tab='hist';toast('Добавлено: '+n+(sk?', пропущено: '+sk:''))}
  else if(a==='editw'){const x=db.workouts.find(q=>q.id===+v);if(db.cur.exs.some(q=>q.name.trim())&&!confirm('Текущий черновик будет заменён. Продолжить?'))return;db.workouts=db.workouts.filter(q=>q.id!==+v);delW(+v);db.cur=JSON.parse(JSON.stringify(x));tab='today';window.scrollTo(0,0)}
  else if(a==='copyall'){const r=prompt('Сколько последних тренировок скопировать? Пусто — все','');if(r===null)return;const n=parseInt(r,10),l=n>0?db.workouts.slice(-n):db.workouts;copy(l.map(x=>wTxt(x,1)).join('\n\n'));return}
  else if(a==='delw'){if(confirm('Удалить эту тренировку?')){db.workouts=db.workouts.filter(w=>w.id!==+v);delW(+v)}}
  save();render();if(a==='newplan'){const q=app.querySelector('.pname');if(q)q.focus()}
});
sortW();render();initCloud();
</script>
</body>
